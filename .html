<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>విద్యార్థినిధి - విద్యా వేదిక</title>
  <!-- Google Fonts: Telugu & Modern English -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gautami&family=Mandali&family=Outfit:wght@400;600;700;800;900&family=Ramabhadra&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      /* 7 Rainbow Colors */
      --c-violet: #8a2be2;
      --c-indigo: #4b0082;
      --c-blue: #0284c7;
      --c-green: #10b981;
      --c-yellow: #f59e0b;
      --c-orange: #f97316;
      --c-red: #ef4444;
      
      --gradient-rainbow: linear-gradient(135deg, #ef4444, #f97316, #f59e0b, #10b981, #0284c7, #4b0082, #8a2be2);
      --gradient-fun: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
      --bg-light: #f0f7ff;
      --white-card: rgba(255, 255, 255, 0.95);
      --shadow-pop: 0 12px 28px -5px rgba(50, 50, 93, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --shadow-glow: 0 0 20px rgba(14, 165, 233, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mandali', 'Outfit', sans-serif; }
    
    body {
      background: #f0f4ff;
      background-image: 
        radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(138, 43, 226, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.12) 0px, transparent 50%);
      color: #1e293b;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Animated Stars & Bubbles Background */
    .bg-bubble {
      position: fixed;
      border-radius: 50%;
      filter: blur(40px);
      z-index: -1;
      opacity: 0.5;
      animation: floatSlow 18s ease-in-out infinite alternate;
    }
    .bubble-1 { width: 350px; height: 350px; background: #ff9ff3; top: -50px; left: -100px; }
    .bubble-2 { width: 300px; height: 300px; background: #54a0ff; top: 40%; right: -80px; animation-delay: -5s; }
    .bubble-3 { width: 280px; height: 280px; background: #1dd1a1; bottom: -50px; left: 20%; animation-delay: -9s; }

    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(60px) rotate(30deg); }
    }

    /* Top Rainbow Animated Strip */
    .rainbow-ribbon {
      height: 8px;
      background: linear-gradient(90deg, #ff4757, #ff6b81, #ffa502, #2ed573, #1e90ff, #3742fa, #8a2be2, #ff4757);
      background-size: 400% 100%;
      animation: rainbowMove 8s linear infinite;
    }
    @keyframes rainbowMove { 0% { background-position: 0% 50%; } 100% { background-position: 400% 50%; } }

    /* Colorful Header */
    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid #e2e8f0;
    }
    .header-content {
      max-width: 1300px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
    }
    .brand-logo {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: var(--gradient-rainbow);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35);
      animation: pulseLogo 3s ease-in-out infinite;
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .brand-text h1 {
      font-family: 'Ramabhadra', sans-serif;
      font-size: 30px;
      background: linear-gradient(135deg, #1e3a8a, #7c3aed, #d946ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .brand-text p {
      font-size: 13px;
      font-weight: 700;
      color: #0284c7;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Secret Login Button */
    .admin-key-btn {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 800;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .admin-key-btn:hover {
      border-color: #f59e0b;
      color: #b45309;
      background: #fef3c7;
      transform: translateY(-2px);
    }
    .admin-key-btn.logged-in {
      background: #dcfce7;
      color: #15803d;
      border-color: #22c55e;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
    }

    /* Colorful Navigation Tabs */
    nav {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      padding: 4px 10px;
      gap: 6px;
    }
    .nav-item {
      padding: 14px 20px;
      border: none;
      background: transparent;
      font-size: 16px;
      font-weight: 800;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 12px;
      transition: all 0.25s ease;
      margin: 4px 0;
    }
    .nav-item i { font-size: 18px; transition: transform 0.2s; }
    .nav-item:hover {
      background: #f1f5f9;
      color: #0f172a;
      transform: translateY(-1px);
    }
    .nav-item:hover i { transform: scale(1.2); }
    
    /* Specific Rainbow Tab Colors on Active */
    .nav-item.active[data-target="mungili"] { background: #fee2e2; color: #dc2626; }
    .nav-item.active[data-target="textbooks"] { background: #ffedd5; color: #ea580c; }
    .nav-item.active[data-target="digital"] { background: #fef3c7; color: #d97706; }
    .nav-item.active[data-target="grammar"] { background: #dcfce7; color: #16a34a; }
    .nav-item.active[data-target="exams"] { background: #e0f2fe; color: #0284c7; }
    .nav-item.active[data-target="quiz"] { background: #e0e7ff; color: #4f46e5; }
    .nav-item.active[data-target="projects"] { background: #f3e8ff; color: #9333ea; }
    .nav-item.active[data-target="additional"] { background: #fce7f3; color: #db2777; }
    .nav-item.active[data-target="about"] { background: #ecfdf5; color: #059669; }

    /* Admin Action Banner */
    #adminControlBar {
      display: none;
      background: linear-gradient(135deg, #1e1b4b, #31104b);
      color: white;
      padding: 14px 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .admin-bar-flex {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .upload-trigger-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
      transition: all 0.2s;
    }
    .upload-trigger-btn:hover { transform: scale(1.04); }

    /* Main Container */
    main {
      max-width: 1300px;
      margin: 30px auto;
      padding: 0 20px;
      min-height: 70vh;
    }

    .tab-section {
      display: none;
      animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tab-section.active { display: block; }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Mungili Hero Card (Super Colorful) */
    .hero-box {
      background: linear-gradient(135deg, #4f46e5, #7c3aed, #ec4899);
      border-radius: 28px;
      padding: 45px;
      color: white;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(124, 58, 237, 0.35);
      margin-bottom: 35px;
      border: 4px solid rgba(255,255,255,0.25);
    }
    .hero-box::before {
      content: "🌸 📚 🎨 🌟 ✨ 🌈";
      position: absolute;
      right: 20px;
      bottom: 10px;
      font-size: 40px;
      opacity: 0.2;
      pointer-events: none;
    }
    .hero-tag {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 800;
      display: inline-block;
      margin-bottom: 16px;
    }
    .hero-box h2 {
      font-family: 'Ramabhadra', sans-serif;
      font-size: 36px;
      line-height: 1.4;
      margin-bottom: 16px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.15);
    }
    .hero-box p {
      font-size: 18px;
      line-height: 1.8;
      max-width: 900px;
      opacity: 0.96;
    }

    /* Objective Cards */
    .purpose-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      margin-top: 25px;
    }
    .purpose-card {
      background: white;
      border-radius: 22px;
      padding: 26px;
      box-shadow: var(--shadow-pop);
      position: relative;
      border: 2px solid #f1f5f9;
      transition: all 0.3s ease;
    }
    .purpose-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 35px rgba(0,0,0,0.08);
      border-color: #38bdf8;
    }
    .card-icon-round {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: white;
      margin-bottom: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.12);
    }
    .purpose-card h3 {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 10px;
    }
    .purpose-card p {
      font-size: 15px;
      color: #64748b;
      line-height: 1.7;
    }

    /* Class Pills (Vibrant Buttons) */
    .class-nav-box {
      background: white;
      border-radius: 20px;
      padding: 14px 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 25px;
      box-shadow: var(--shadow-pop);
      border: 2px solid #e2e8f0;
    }
    .c-pill {
      padding: 10px 22px;
      border-radius: 50px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      font-size: 15px;
      font-weight: 800;
      color: #475569;
      cursor: pointer;
      transition: all 0.25s;
    }
    .c-pill:hover {
      border-color: #38bdf8;
      background: #f0f9ff;
      color: #0284c7;
      transform: translateY(-2px);
    }
    .c-pill.active {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: white;
      border-color: transparent;
      box-shadow: 0 6px 15px rgba(2, 132, 199, 0.35);
    }

    /* Resource Cards (Files & Uploads) */
    .resources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    .file-card {
      background: white;
      border-radius: 22px;
      padding: 24px;
      box-shadow: var(--shadow-pop);
      border: 2px solid #eef2f6;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }
    .file-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 35px rgba(0,0,0,0.1);
      border-color: #60a5fa;
    }
    .file-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: var(--gradient-rainbow);
    }
    .badge-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      width: fit-content;
      margin-bottom: 12px;
    }
    .badge-pdf { background: #fee2e2; color: #dc2626; }
    .badge-video { background: #ffedd5; color: #ea580c; }
    .badge-image { background: #e0f2fe; color: #0284c7; }
    .badge-ppt { background: #fef3c7; color: #d97706; }
    .badge-link { background: #f3e8ff; color: #9333ea; }

    .file-title {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .file-desc {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .file-buttons {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }
    .btn-view-card {
      flex: 1;
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid #e0e7ff;
      background: #eef2ff;
      color: #4338ca;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-view-card:hover {
      background: #4338ca;
      color: white;
      border-color: #4338ca;
    }
    .btn-down-card {
      flex: 1;
      padding: 10px 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .btn-down-card:hover { transform: scale(1.02); }
    .btn-del-card {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-del-card:hover { background: #fca5a5; }

    /* Special Speech Section (అదనపు సమాచారం) */
    .speech-container {
      background: white;
      border-radius: 28px;
      padding: 35px;
      box-shadow: var(--shadow-pop);
      border: 3px solid #e0e7ff;
      margin-top: 25px;
    }
    .voice-visualizer {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 15px 0 25px;
    }
    .voice-bar {
      width: 6px;
      height: 12px;
      border-radius: 10px;
      background: #cbd5e1;
      transition: height 0.15s ease;
    }
    .voice-visualizer.active .voice-bar {
      background: linear-gradient(180deg, #ff4757, #ffa502, #2ed573, #1e90ff);
      animation: danceWave 0.6s infinite alternate ease-in-out;
    }
    .voice-bar:nth-child(1) { animation-delay: 0.1s; }
    .voice-bar:nth-child(2) { animation-delay: 0.3s; }
    .voice-bar:nth-child(3) { animation-delay: 0.5s; }
    .voice-bar:nth-child(4) { animation-delay: 0.2s; }
    .voice-bar:nth-child(5) { animation-delay: 0.4s; }
    @keyframes danceWave { 0% { height: 10px; } 100% { height: 38px; } }

    .kids-word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }
    .word-bubble-card {
      background: #f8fafc;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 2px solid #e2e8f0;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .word-bubble-card:hover {
      transform: translateY(-4px) scale(1.03);
      border-color: #38bdf8;
      background: #f0f9ff;
      box-shadow: 0 8px 18px rgba(14, 165, 233, 0.18);
    }
    .word-text-large {
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
    }
    .play-sound-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.35);
      transition: transform 0.2s;
    }
    .word-bubble-card:hover .play-sound-icon { transform: scale(1.15); }

    /* Teacher Profile (నా గురించి) */
    .profile-banner {
      background: white;
      border-radius: 30px;
      padding: 40px;
      box-shadow: var(--shadow-pop);
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 40px;
      align-items: center;
      border: 3px solid #e2e8f0;
      position: relative;
      overflow: hidden;
    }
    .profile-banner::after {
      content: '';
      position: absolute;
      right: 0; bottom: 0;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .profile-badge-box {
      width: 240px;
      height: 240px;
      border-radius: 28px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed, #db2777);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 16px 32px rgba(99, 102, 241, 0.35);
      border: 4px solid white;
    }
    .profile-badge-box i { font-size: 80px; margin-bottom: 12px; }
    .profile-badge-box span { font-size: 16px; font-weight: 800; letter-spacing: 1px; }

    .profile-details-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .profile-details-table tr { border-bottom: 1px solid #f1f5f9; }
    .profile-details-table td {
      padding: 14px 10px;
      font-size: 17px;
    }
    .profile-details-table td:first-child {
      font-weight: 800;
      color: #64748b;
      width: 180px;
    }

    /* Modals */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: white;
      border-radius: 28px;
      width: 100%;
      max-width: 550px;
      padding: 35px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      border: 4px solid #f1f5f9;
    }
    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .modal-close-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #f1f5f9;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #64748b;
      transition: all 0.2s;
    }
    .modal-close-btn:hover { background: #fee2e2; color: #dc2626; }
    
    .form-item { margin-bottom: 18px; }
    .form-item label { display: block; font-weight: 800; font-size: 14px; margin-bottom: 6px; color: #334155; }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: #0284c7; }
    .btn-submit-action {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
